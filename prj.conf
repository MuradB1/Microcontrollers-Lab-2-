# Enable Bluetooth stack
CONFIG_BT=y

# Enable broadcaster role.
# This is enough for advertising-only BLE device.
CONFIG_BT_BROADCASTER=y
# We are not creating GATT services or accepting connections.
# Keep peripheral/connection features disabled unless your SDK requires them.
# CONFIG_BT_PERIPHERAL is intentionally not enabled.

# Custom device name visible in nRF Connect
CONFIG_BT_DEVICE_NAME="Murad_nRF52840"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Logging / console output
CONFIG_LOG=y
CONFIG_PRINTK=y

# Optional: make logs readable
CONFIG_LOG_DEFAULT_LEVEL=3

# TX power configuration.
# Use +4 dBm if supported by your SDK/board.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y